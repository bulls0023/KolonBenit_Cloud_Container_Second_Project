# =====================================================================
# Hybrid Toy Project - 로컬 통합 검증
# 계약: README v3.1 §6.1 / §6.8 / §13.2 / 구축설명서 §6.2
#
# 목적: WAS 를 EKS 에 올리기 전에 "실제 MySQL" 위에서 기동시킨다.
#       H2 부트스트랩 테스트는 엔티티에서 스키마를 만들었으므로
#       01_schema.sql 과의 정합을 검증하지 못했다. 여기서 처음 검증된다.
#
# 사용:
#   cd local
#   .\prepare.ps1          # 이미지 digest 해석 + mysql-init 생성 + .env 발급
#   docker compose up --build
#   .\verify-was.ps1       # 계약 검증 21개 시나리오
#   docker compose down -v # -v 를 빼면 다음 실행 때 init 스크립트가 돌지 않는다
# =====================================================================

services:

  mysql:
    image: mysql:8.0
    container_name: hybrid-toy-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      # RDS 파라미터 그룹과 동일하게 TLS 를 강제한다 (README §13.2).
      # 로컬에서만 평문 허용으로 두면 EKS 에서 처음 실패한다.
      - --require_secure_transport=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: commondb
      TZ: Asia/Seoul
    ports:
      # 호스트에서 직접 붙어볼 때만 쓴다. WAS 는 컨테이너 네트워크로 붙는다.
      - "13306:3306"
    volumes:
      # 파일명 순서대로 실행된다: 01 -> 02 -> 03 -> 04
      # ⚠️ 최초 기동(빈 볼륨)에서만 실행된다. 재실행하려면 down -v 로 볼륨을 지운다.
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 04_icd_seed.sql 이 5.8MB 라 초기화에 시간이 걸린다.
      # 단순 ping 은 init 완료 전에도 통과하므로 실제 테이블 건수를 본다.
      # ⚠️ --ssl-mode 을 주지 않는다. 컨테이너 내부 접속은 유닉스 소켓이며,
      #    require_secure_transport 는 소켓 접속을 예외로 둔다.
      #    소켓에 TLS 를 강제하면 헬스체크가 영원히 실패한다.
      test: >
        mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" -N -e
        "SELECT COUNT(*) FROM commondb.icd_code_synonym" 2>/dev/null | grep -q '^37543$$'
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  was:
    build:
      # prepare.ps1 이 .env 에 절대경로를 써 준다.
      # 상대 경로를 박아두면 리포 배치가 다를 때 조용히 엉뚱한 곳을 빌드한다.
      context: ${WAS_CONTEXT}
      dockerfile: Dockerfile
    container_name: hybrid-toy-was
    depends_on:
      mysql:
        # init 완료까지 기다린다. condition 없이 두면 WAS 가 먼저 떠서
        # validate 실패로 죽고, 원인을 스키마 오류로 오진하게 된다.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: commondb
      DB_USER: app_was
      DB_PASSWORD: ${APP_WAS_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz | grep -q '\"db\":\"up\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  mysql-data:
