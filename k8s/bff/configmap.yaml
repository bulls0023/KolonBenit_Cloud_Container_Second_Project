# =====================================================================
# BFF ConfigMap
# 계약: README v3.1 §6.2 환경변수 계약
#
# ⚠️ JWT_SIGNING_KEY 는 여기 없다. Secret bff-secret 이다.
# ⚠️ JWT_AUDIENCE 는 hybrid-toy 가 아니라 hybrid-toy-api 다.
#    값이 어긋나면 BFF 가 자기가 발급한 토큰을 거부한다.
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: bff-config
  namespace: app
data:
  # 하드코딩 금지. 네임스페이스가 바뀌면 이 값만 고친다 (§6.2).
  WAS_BASE_URL: "http://was-svc.app.svc.cluster.local:8080"

  JWT_ISSUER: "hybrid-toy-bff"
  JWT_AUDIENCE: "hybrid-toy-api"
  PATIENT_JWT_TTL: "30m"
  STAFF_JWT_TTL: "8h"

  TZ: "Asia/Seoul"
  SPRING_PROFILES_ACTIVE: "default"
