# =====================================================================
# BFF Secret - 예시. 실제 값이 든 파일은 커밋 금지
#
# JWT_SIGNING_KEY 는 이미 Secrets Manager 'bff-secret' 에 있다.
# 클러스터로 가져오는 방법 두 가지:
#
# A) 수동 (현 단계 채택)
#   $k = (aws secretsmanager get-secret-value --secret-id bff-secret `
#           --region ap-northeast-2 --query SecretString --output text `
#         | ConvertFrom-Json).JWT_SIGNING_KEY
#   kubectl -n app create secret generic bff-secret --from-literal=JWT_SIGNING_KEY=$k
#   $k = $null
#
# B) External Secrets Operator (백로그)
#   Secrets Manager 를 단일 원본으로 삼아 자동 동기화. 회전이 필요해지면 도입한다.
#
# ⚠️ 값이 32바이트 미만이면 BFF 가 기동에서 실패한다 (HS256 요건).
#    현재 값은 Base64 64자다.
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: bff-secret
  namespace: app
type: Opaque
stringData:
  JWT_SIGNING_KEY: "__REPLACE_ME__"
