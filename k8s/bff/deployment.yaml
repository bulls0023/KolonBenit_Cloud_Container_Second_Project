# =====================================================================
# BFF - Deployment + Service
# 계약: README v3.1 §6.1 / §6.2 / §6.5 / §11.0 / §11.3
#
# ⚠️ image 태그는 자리표시자다. deploy.ps1 이 git short SHA 로 치환한다.
# ⚠️ BFF 는 DB 에 접근하지 않는다. DataSource 관련 env 가 없는 것이 정상이다.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: app
  labels:
    app: bff
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: bff
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # ⚠️ 0 이어야 한다. 1 이면 롤아웃 중 정상 파드가 0 이 될 수 있고,
      #    그 순간 BFF 의 WAS 호출이 전부 503 이 된다.
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bff
    spec:
      # PSA restricted 대응. Dockerfile 의 USER 10001 과 일치해야 한다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # 같은 노드에 몰리지 않게 한다. 노드 1대가 죽어도 서비스가 남는다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bff

      containers:
        - name: bff
          image: 597106152264.dkr.ecr.ap-northeast-2.amazonaws.com/hybrid-toy/bff:__TAG__
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: bff-config
            - secretRef:
                name: bff-secret

          env:
            # LimitRange 512Mi 기준 힙 상한 약 384Mi (README §15).
            # Dockerfile 의 JAVA_OPTS 를 덮어쓴다. 매니페스트가 최종 권위다.
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC -Duser.timezone=Asia/Seoul"
            # 운영은 HTTPS(ALB 종단)다. Secure 쿠키를 강제한다 (§6.5).
            # 로컬 검증의 false 값을 그대로 가져오지 않는다.
            - name: COOKIE_SECURE
              value: "true"

          # ⚠️ limits.cpu 는 ResourceQuota 총량과 함께 계산해야 한다.
          #    1코어 x 4파드(WAS2+BFF2) = 4 로 quota(limits.cpu:4)를 정확히
          #    소진해 patient-web 이 스케줄되지 못했다 (실측).
          #    JVM 이 실제로 1코어를 쓴 적이 없다. 500m 로 낮춘다.
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # -------------------------------------------------------------
          # startupProbe - BFF 는 DB 가 없어 WAS 보다 빠르지만,
          # Security 필터 체인 구성이 있어 여유를 둔다.
          # -------------------------------------------------------------
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          # ⚠️ BFF 의 /readyz 는 WAS 상태를 확인하지 않는다 (§7.9).
          #    상위의 readiness 에 하위 상태를 넣으면 WAS 순단에 BFF 파드가
          #    전부 NotReady 로 빠져 장애가 증폭된다.
          #    WAS 장애는 요청 시점 503 upstream_unavailable 로 처리한다.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # readiness 는 /readyz. DB 커넥션까지 확인한다.
          # 실패하면 트래픽만 빠지고 파드는 살아 있다.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # readOnlyRootFilesystem 대응. JVM 이 /tmp 에 쓴다.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # graceful shutdown. application.yaml 의 server.shutdown=graceful 과 한 쌍.
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: bff-svc
  namespace: app
  labels:
    app: bff
spec:
  # ClusterIP. 외부 노출은 Ingress 의 /api/bff/patient 경로로만 이뤄진다.
  # 직원 경로(/api/bff/staff)는 Ingress 에 등록하지 않는다 (§6.9).
  # cloudflared 가 클러스터 내부에서 이 Service 를 직접 호출한다.
  type: ClusterIP
  selector:
    app: bff
  ports:
    - name: http
      port: 8080
      targetPort: http
