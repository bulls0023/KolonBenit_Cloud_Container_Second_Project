# =====================================================================
# WAS ConfigMap
# 계약: README v3.1 §6.2 환경변수 계약
#
# ⚠️ 자격증명은 여기 넣지 않는다. DB_USER / DB_PASSWORD 는 Secret 이다.
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: was-config
  namespace: app
data:
  DB_HOST: "hybrid-toy-rds.cfmws2co6i6j.ap-northeast-2.rds.amazonaws.com"
  DB_PORT: "3306"
  DB_NAME: "commondb"
  TZ: "Asia/Seoul"

  # ⚠️ local 프로파일을 쓰지 않는다.
  #    local 은 show-sql=true 라 운영 로그에 SQL 이 흘러나온다.
  #    기본 프로파일은 SQL 로깅이 WARN 이다.
  SPRING_PROFILES_ACTIVE: "default"
