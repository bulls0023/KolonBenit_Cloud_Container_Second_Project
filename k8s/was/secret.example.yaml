# =====================================================================
# WAS Secret - 예시. 실제 값이 든 파일은 커밋 금지 (README §11.0)
#
# 생성 (값을 파일로 남기지 않는다):
#
#   $pw = Read-Host "app_was 비밀번호" -AsSecureString
#   $pt = [Runtime.InteropServices.Marshal]::PtrToStringBSTR(
#           [Runtime.InteropServices.Marshal]::SecureStringToBSTR($pw))
#   kubectl -n app create secret generic was-secret `
#     --from-literal=DB_USER=app_was `
#     --from-literal=DB_PASSWORD=$pt
#   $pt = $null
#
# 확인 (값은 출력하지 않는다):
#   kubectl -n app get secret was-secret -o jsonpath="{.data}" | ConvertFrom-Json
#
# ⚠️ admin 계정을 쓰지 않는다. app_was 다 (README §16-7).
#    admin 은 DROP/ALTER 권한이 있어 애플리케이션이 스키마를 부술 수 있다.
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: was-secret
  namespace: app
type: Opaque
stringData:
  DB_USER: "app_was"
  DB_PASSWORD: "__REPLACE_ME__"
