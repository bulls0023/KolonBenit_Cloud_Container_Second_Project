# =====================================================================
# patient-web nginx
# 계약: README v3.1 §6.9 / §11.0
#
# ⚠️ /api/bff/patient 를 프록시하지 않는다.
#    Ingress 가 그 경로를 bff-svc 로 직접 라우팅한다 (§6.9).
#    여기서 또 프록시하면 BFF 로 가는 경로가 둘이 되고, 한쪽만 고치는
#    사고가 난다. 브라우저는 동일 출처로 호출하므로 CORS 도 불필요하다.
#
# ⚠️ /api/bff/staff 는 404 다 (§6.9).
#    직원 API 는 Cloudflare Tunnel 로만 도달한다. 외부 도메인에서
#    직원 경로가 열려 있으면 설계 위반이다.
# =====================================================================

worker_processes auto;

# non-root(101) 실행. 기본 경로에 쓰기 권한이 없다.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # readOnlyRootFilesystem 대응. 전부 emptyDir 로 마운트한다.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # 서버 버전 노출 금지
    server_tokens off;

    log_format main '$remote_addr - $status "$request" $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    server {
        # 계약: 컨테이너 포트 8080 (§11.0)
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # -------------------------------------------------------------
        # 헬스체크. ALB 타깃 그룹이 이 경로를 본다 (Ingress annotation).
        # 정적 파일이 아니라 즉답이어야 한다.
        # -------------------------------------------------------------
        location = /healthz {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok"}';
        }

        location = /readyz {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok"}';
        }

        # -------------------------------------------------------------
        # 직원 API 는 이 도메인에서 존재하지 않는다 (§6.9).
        # Ingress 에 규칙이 없으므로 이 경로는 여기로 떨어진다.
        # -------------------------------------------------------------
        location /api/bff/staff {
            add_header Content-Type application/json always;
            return 404 '{"error":"not_found","message":"요청한 리소스를 찾을 수 없습니다."}';
        }

        # 보안 헤더
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 정적 자산 캐시. index.html 은 캐시하지 않는다.
        location = /index.html {
            add_header Cache-Control "no-store" always;
        }
    }
}
