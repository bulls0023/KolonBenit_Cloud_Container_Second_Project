# =====================================================================
# Gradle 설정
# =====================================================================

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# ⚠️ Windows 콘솔에서 테스트 출력의 한글이 깨지는 문제
#    Gradle 데몬과 테스트 JVM 의 file.encoding 이 CP949 면 로그가 뭉개진다.
#    (예: "JPA 부트스트랩" -> "JPA 遺?몄뒪?몃옪")
#    위 -Dfile.encoding=UTF-8 이 데몬을, 아래가 테스트 JVM 을 담당한다.
#    PowerShell 쪽도 함께 맞춰야 한다:
#      [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
